[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-automation"
version = "0.1.0"
description = "Automated alert enrichment, triage scoring, and response on top of a Wazuh SIEM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felix Githure", email = "githure.felix95@gmail.com" }]
keywords = ["soar", "soc", "automation", "wazuh", "threat-intel", "triage", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/manlikefelo/soc-automation"
Repository = "https://github.com/manlikefelo/soc-automation"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
]

[project.scripts]
soc-triage = "soc_automation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_automation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["soc_automation"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
